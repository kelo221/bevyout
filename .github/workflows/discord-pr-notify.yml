name: Discord PR notify

on:
  pull_request:
    types: [opened, synchronize, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to notify
        required: true
        type: number

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send server-side Discord notification
        env:
          DISCORD_BOT_URL: ${{ secrets.DISCORD_BOT_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTION: ${{ github.event.action || 'opened' }}
          MERGED: ${{ github.event.pull_request.merged }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${DISCORD_BOT_URL:-}" || -z "${DISCORD_BOT_TOKEN:-}" ]]; then
            echo "Discord bot URL/token are not available; skipping notification."
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "pr_number must be a positive integer."
              exit 1
            fi

            pr_json=$(curl --silent --show-error --fail --max-time 15 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
            PR_NUMBER=$(jq -r '.number | tostring' <<<"$pr_json")
            PR_TITLE=$(jq -r '.title // ""' <<<"$pr_json")
            PR_BODY=$(jq -r '.body // ""' <<<"$pr_json")
            PR_URL=$(jq -r '.html_url // ""' <<<"$pr_json")
            PR_AUTHOR=$(jq -r '.user.login // ""' <<<"$pr_json")
            ACTION="opened"
            MERGED="false"
          fi

          payload=$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg event "$ACTION" \
            --arg number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg body "${PR_BODY:-}" \
            --arg author "$PR_AUTHOR" \
            --arg url "$PR_URL" \
            --arg merged "${MERGED:-false}" \
            '{
              repository: $repository,
              event: $event,
              pull_request: {
                number: ($number | tonumber),
                title: $title,
                body: $body,
                author: $author,
                url: $url,
                merged: ($merged == "true")
              }
            }')

          response=$(curl --silent --show-error --fail --max-time 30 \
            -H "Authorization: Bearer ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$payload" \
            "$DISCORD_BOT_URL")

          if [[ "$(jq -r '.ok // false' <<<"$response")" != "true" ]]; then
            echo "Discord bot returned an unsuccessful response."
            exit 1
          fi

          source=$(jq -r '.source // "unknown"' <<<"$response")
          personality=$(jq -r '.personality // "unknown"' <<<"$response")
          echo "Sent server-side Discord notification for PR #${PR_NUMBER} (${ACTION}); source=${source}; personality=${personality}."
