name: Discord PR notify

on:
  workflow_run:
    workflows: [Discord PR event relay]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to notify
        required: true
        type: number

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Send server-side Discord notification
        env:
          DISCORD_BOT_URL: ${{ secrets.DISCORD_BOT_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${DISCORD_BOT_URL:-}" || -z "${DISCORD_BOT_TOKEN:-}" || -z "${DISCORD_WEBHOOK:-}" ]]; then
            echo "Discord bot URL/token/webhook are not available; skipping notification."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
          else
            PR_NUMBER="$WORKFLOW_RUN_PR_NUMBER"
          fi

          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "A valid pull request number was not found."
            exit 1
          fi

          pr_json=$(curl --silent --show-error --fail --max-time 15 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")

          PR_NUMBER=$(jq -r '.number | tostring' <<<"$pr_json")
          PR_TITLE=$(jq -r '.title // ""' <<<"$pr_json")
          PR_BODY=$(jq -r '.body // ""' <<<"$pr_json")
          PR_URL=$(jq -r '.html_url // ""' <<<"$pr_json")
          PR_AUTHOR=$(jq -r '.user.login // ""' <<<"$pr_json")
          PR_STATE=$(jq -r '.state // "open"' <<<"$pr_json")
          MERGED=$(jq -r 'if .merged == true then "true" else "false" end' <<<"$pr_json")

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$PR_STATE" == "open" ]]; then
            ACTION="opened"
            MERGED="false"
          else
            ACTION="closed"
          fi

          payload=$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg event "$ACTION" \
            --arg number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --arg author "$PR_AUTHOR" \
            --arg url "$PR_URL" \
            --arg merged "$MERGED" \
            '{
              repository: $repository,
              event: $event,
              pull_request: {
                number: ($number | tonumber),
                title: $title,
                body: $body,
                author: $author,
                url: $url,
                merged: ($merged == "true")
              }
            }')

          response=$(curl --silent --show-error --fail --max-time 30 \
            -H "Authorization: Bearer ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$payload" \
            "$DISCORD_BOT_URL")

          if [[ "$(jq -r '.ok // false' <<<"$response")" != "true" ]]; then
            echo "Discord bot returned an unsuccessful response."
            exit 1
          fi

          discord_payload=$(jq -c '.discord_payload // empty' <<<"$response")
          if [[ -z "$discord_payload" ]]; then
            echo "Discord bot did not return a Discord payload."
            exit 1
          fi

          curl --silent --show-error --fail --max-time 15 \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$discord_payload" \
            "$DISCORD_WEBHOOK" >/dev/null

          source=$(jq -r '.source // "unknown"' <<<"$response")
          personality=$(jq -r '.personality // "unknown"' <<<"$response")
          echo "Sent server-generated Discord notification for PR #${PR_NUMBER} (${ACTION}); source=${source}; personality=${personality}."
