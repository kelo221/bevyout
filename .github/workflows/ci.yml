name: CI

on:
  push:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "tests/**"
      - "features/**"
      - "third_party/blend/**"
      - ".cargo/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
      - ".pi/**"
      - ".pi-lens.json"
      - "sgconfig.yml"
      - "tools/ast-grep/**"
      - "tools/harness/**"
      - "tools/bevyout-mcp/**"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "tests/**"
      - "features/**"
      - "third_party/blend/**"
      - ".cargo/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
      - ".pi/**"
      - ".pi-lens.json"
      - "sgconfig.yml"
      - "tools/ast-grep/**"
      - "tools/harness/**"
      - "tools/bevyout-mcp/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # ponytail: no one reads debuginfo in CI; keeps builds and cache small
  CARGO_PROFILE_DEV_DEBUG: "0"
  # ponytail: opt-level 3 deps are for local framerates, not unit tests
  CARGO_PROFILE_DEV_PACKAGE_ALL_OPT_LEVEL: "1"

jobs:
  lint:
    name: fmt, clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config \
            libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config \
            libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Test
        run: cargo test --locked

      - name: Miniature CPU lightmap bake
        run: cargo test --locked --lib miniature_surface_bake_produces_finite_ktx2

      - name: Lightmap binding projection
        run: cargo test --locked --lib lightmap_binding_projection_preserves_primitive_identity_and_uv_rect

  harness:
    name: architecture and harness guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ast-grep
        run: npm install --global @ast-grep/cli@0.42.3

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install MCP dependencies
        run: bun install --cwd tools/bevyout-mcp --frozen-lockfile --ignore-scripts

      - name: AST rule fixtures
        run: bun run tools/harness/ast_guard.ts --self-test

      - name: Prepared revision guard fixtures
        run: bun run tools/harness/revision_guard.ts --self-test

      - name: Performance scanner fixtures
        run: bun run .agents/skills/bevy-performance-audit/scripts/scan_bevy_code.ts --self-test

      - name: Blocking changed-file AST rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA="HEAD^"; fi
          bun run tools/harness/ast_guard.ts --base "$BASE_SHA" --blocking-only

      - name: Prepared revision and data guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA="HEAD^"; fi
          bun run tools/harness/revision_guard.ts --base "$BASE_SHA"
          bun run tools/harness/data_guard.ts --base "$BASE_SHA"

      - name: MCP adapter typecheck and tests
        run: |
          bun run --cwd tools/bevyout-mcp typecheck
          bun test --cwd tools/bevyout-mcp

  nextest-linux:
    name: nextest and architecture (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config \
            libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Workspace nextest
        run: cargo nextest run --workspace --locked -E 'not binary(features)'

      - name: Architecture gate
        run: cargo nextest run --locked --test architecture

  security-advisory:
    name: security and dependency hygiene (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-machete@0.9.2
      - name: Deny
        run: cargo deny check --hide-inclusion-graph
      - name: Audit
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
      - name: Machete
        run: cargo machete --skip-target-dir

  performance-advisory:
    name: static performance inventory (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Generate bounded findings
        run: |
          mkdir -p .bevyout
          bun run .agents/skills/bevy-performance-audit/scripts/scan_bevy_code.ts . --json --max-per-category 20 > .bevyout/performance-candidates.json
      - uses: actions/upload-artifact@v4
        with:
          name: performance-candidates
          path: .bevyout/performance-candidates.json

  coverage-advisory:
    name: coverage artifact (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config libasound2-dev libudev-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143,cargo-llvm-cov@0.8.7
      - name: Collect coverage
        run: |
          mkdir -p .bevyout/coverage
          cargo llvm-cov --workspace --lcov --output-path .bevyout/coverage/lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: llvm-coverage
          path: .bevyout/coverage/lcov.info
