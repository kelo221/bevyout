name: CI

on:
  push:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "tests/**"
      - "features/**"
      - "third_party/blend/**"
      - ".cargo/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "tests/**"
      - "features/**"
      - "third_party/blend/**"
      - ".cargo/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # ponytail: no one reads debuginfo in CI; keeps builds and cache small
  CARGO_PROFILE_DEV_DEBUG: "0"
  # ponytail: opt-level 3 deps are for local framerates, not unit tests
  CARGO_PROFILE_DEV_PACKAGE_ALL_OPT_LEVEL: "1"

jobs:
  lint:
    name: fmt, clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config \
            libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config \
            libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Test
        run: cargo test --locked

      - name: Miniature CPU lightmap bake
        run: cargo test --locked --lib miniature_surface_bake_produces_finite_ktx2

      - name: Lightmap binding projection
        run: cargo test --locked --lib lightmap_binding_projection_preserves_primitive_identity_and_uv_rect
