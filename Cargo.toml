[package]
name = "bevyout"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/bevyout-core"]
exclude = ["NifConverter/nifty"]
resolver = "3"

[features]
default = []
# Yarn's Bevy-free compiler/runtime is the optional compatibility boundary.
# The Bevy 0.18-only upstream plugin is intentionally not enabled; the viewer
# adapter owns the Bevy 0.19 integration and keeps the default build Yarn-free.
dialogue-yarn = ["dep:yarnspinner"]

[dependencies]
bevyout-core = { path = "crates/bevyout-core" }
# WAV covers the ambient and interaction clips staged by the importer, while
# Vorbis enables the original Fallout OGG voice assets. MP3 metadata is
# retained in manifests, but Bevy's MP3 feature currently resolves to an
# unavailable symphonia patch in this workspace's offline cache.
bevy = { version = "0.19.0", features = [
  "wav",
  "vorbis",
  "pbr_specular_textures",
  "pbr_transmission_textures",
  "bevy_remote",
  "ktx2",
  "basis-universal",
  "system_clipboard",
] }
avian3d = { version = "=0.7.0", default-features = false, features = [
  "3d",
  "f32",
  "parry-f32",
  "parallel",
  "xpbd_joints",
] }
bevy_boxddd = { version = "0.2.0", features = ["debug-gizmos"] }
bvh = "0.12"
esplugin = "6.1.4"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
gltf = { version = "1.4", default-features = false, features = [
  "names",
  "utils",
  "KHR_materials_volume",
] }
hound = "3.5.1"
image = { version = "0.25", default-features = false, features = [
  "dds",
  "png",
] }
libc = "0.2"
lewton = "0.10.2"
nalgebra = "0.34"
nif = { git = "https://github.com/kelo221/nifty.git", rev = "17f5769", default-features = false, features = [
  "fo3_glb",
] }
rayon = "1.10"
ron = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.38.4"
toml = "0.8"
# M4 wave 3 (#112): bevy_landmass navigation-backend spike. Pinned exact per
# the wave plan. `glam` is pinned to the exact version `bevy_math` 0.19.0
# resolves to (see Cargo.lock) so `src/viewer/nav/landmass_graph.rs`'s plain
# `glam::Vec3` values are the literal same type as `bevy_landmass::coords`'s
# `ThreeD::Coordinate` without that pure module depending on `bevy_math`/
# `bevy` -- required because `bevy_landmass::NavigationMesh3d::vertices` is
# `Vec<bevy_math::Vec3>`, not `Vec<landmass::Vec3>` (a different glam major
# version landmass itself pins internally; see the module doc comment).
bevy_landmass = "=0.12.0"
glam = "=0.32.1"
# Issue #136 (M4 wave 6): `landmass_graph.rs`'s navmesh-erosion conversion
# step logs a stable diagnostic line (`nav erosion: polys ... eroded ...
# pinch-guard ...`) per the project's tracing-only logging rule (AGENTS.md
# "Logging"). `bevy::prelude::info!`/`warn!` are the same `tracing` macros
# re-exported through `bevy_log`, but pulling in the full `bevy` crate here
# would break `landmass_graph.rs`'s deliberate no-full-Bevy-import shape
# (see that file's module doc comment) and its verbatim `#[path]` inclusion
# by `tests/features.rs`. `tracing` itself is already resolved in
# `Cargo.lock` as a transitive dependency of `bevy`/`bevy_landmass`, so
# adding it directly here does not change what gets built, only what this
# one file may call.
tracing = "0.1"
yarnspinner = { version = "0.8.0", optional = true, features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[patch.crates-io]
# The viewer binds prepared static point-shadow cubemaps through Bevy's existing
# depth-comparison path and limits point-shadow shading to one lookup per pixel.
bevy_pbr = { path = "third_party/bevy_pbr-0.19.0" }

[dev-dependencies]
# Executable-spec seed (WP6): Gherkin feature files run against real code via
# #[path]-included modules (see tests/features.rs for why, given this crate has
# no lib target).
cucumber = "0.23"
futures = "0.3"
proptest = "1.6"

[[test]]
name = "features"
harness = false

[[example]]
name = "yarn_smoke"
path = "examples/yarn_smoke.rs"
required-features = ["dialogue-yarn"]

# Enable a small amount of optimization in the dev profile.
[profile.dev]
incremental = false # Stops frequent tiny writes of incremental compilation
debug = 0           # Disables debug symbols, massively reducing target/ size
opt-level = 1
# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
