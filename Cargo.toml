[package]
name = "bevyout"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/bevyout-core"]
resolver = "3"

[dependencies]
bevyout-core = { path = "crates/bevyout-core" }
# WAV covers the ambient and interaction clips staged by the importer. MP3
# metadata is retained in manifests, but Bevy's MP3 feature currently resolves
# to an unavailable symphonia patch in this workspace's offline cache.
bevy = { version = "0.19.0", features = ["wav", "pbr_specular_textures", "bevy_remote", "ktx2"] }
bevy_boxddd = { version = "0.2.0", features = ["debug-gizmos"] }
bvh = "0.12"
esplugin = "6.1.4"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
gltf = { version = "1.4", default-features = false, features = ["names", "utils"] }
image = { version = "0.25", default-features = false, features = ["png"] }
nalgebra = "0.34"
rayon = "1.10"
ron = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
# M4 wave 3 (#112): bevy_landmass navigation-backend spike. Pinned exact per
# the wave plan. `glam` is pinned to the exact version `bevy_math` 0.19.0
# resolves to (see Cargo.lock) so `src/viewer/nav/landmass_graph.rs`'s plain
# `glam::Vec3` values are the literal same type as `bevy_landmass::coords`'s
# `ThreeD::Coordinate` without that pure module depending on `bevy_math`/
# `bevy` -- required because `bevy_landmass::NavigationMesh3d::vertices` is
# `Vec<bevy_math::Vec3>`, not `Vec<landmass::Vec3>` (a different glam major
# version landmass itself pins internally; see the module doc comment).
bevy_landmass = "=0.12.0"
glam = "=0.32.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[patch.crates-io]
# The viewer binds prepared static point-shadow cubemaps through Bevy's existing
# depth-comparison path and limits point-shadow shading to one lookup per pixel.
bevy_pbr = { path = "third_party/bevy_pbr-0.19.0" }

[dev-dependencies]
# Executable-spec seed (WP6): Gherkin feature files run against real code via
# #[path]-included modules (see tests/features.rs for why, given this crate has
# no lib target).
cucumber = "0.23"
futures = "0.3"
proptest = "1.6"

[[test]]
name = "features"
harness = false

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
