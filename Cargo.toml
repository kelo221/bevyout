[package]
name = "bevyout"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.0"
esplugin = "6.1.4"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
ron = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
