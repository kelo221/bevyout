[advisories]
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "Bevy 0.19 pins wayland-scanner ^0.31 and quick-xml ^0.39; this Linux build-time parser does not process game/runtime input." },
  { id = "RUSTSEC-2026-0195", reason = "Bevy 0.19 pins wayland-scanner ^0.31 and quick-xml ^0.39; this Linux build-time parser does not process game/runtime input." },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "GPL-3.0-or-later",
  "GPL-3.0-only",
  "GPL-3.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/kelo221/nifty.git"]
