# Copy this file to .bevyout/config.toml and edit the paths for your machine.

[fallout3]
game_root = "C:/Games/Fallout 3 goty"
plugin = "Fallout3.esm"

[tools]
# Optional: omitted values use automatic detection (Windows default install
# paths, or "magick"/"ktx"/"toktx" on PATH). Automatic detection does not
# check macOS/Linux install locations for Blender, so set it explicitly there,
# e.g. "/Applications/Blender.app/Contents/MacOS/Blender" on macOS.
blender = "C:/Program Files/Blender Foundation/Blender 5.2/blender.exe"
# Irradiance baking is pinned to Blender 4.5 LTS; preparation continues to use
# the general Blender path above.
irradiance_blender = "C:/Program Files/Blender Foundation/Blender 4.5/blender.exe"
ktx = "C:/Program Files/KTX-Software/bin/ktx.exe"

[output]
cache_dir = ".bevyout/cache"

[world]
# Runtime cell map and predictive door-graph neighbor preloader (issue #51):
# how many cells (the active cell plus preloaded door-graph neighbors) may be
# resident at once before the farthest one by graph distance is evicted.
# Optional: defaults to 4.
resident_cell_limit = 4
