[alias]
run-dev = "run --features bevy/dynamic_linking,lightmap-gpu-solari"
run-play = "run --profile dev-opt --features bevy/dynamic_linking,lightmap-gpu-solari"
check-dev = "check --features bevy/dynamic_linking"
test-dev = "test --features bevy/dynamic_linking"

# Faster linking than link.exe on this host. rust-lld ships with the toolchain.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
